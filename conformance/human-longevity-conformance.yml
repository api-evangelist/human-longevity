scope_note: >-
  Human Longevity publishes no API contract, so every cross-cutting API standard below that depends
  on a contract is recorded as not-conformant on the honest basis that there is nothing to conform.
  The standards it DOES conform to are the ones its client-portal authorization server implements,
  plus the clinical/regulatory programs its own pages state.
