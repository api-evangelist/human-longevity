aid: human-longevity
name: Human Longevity
description: Human Longevity, Inc. (HLI) is a San Diego based precision-health company founded in 2013
  by Dr. J. Craig Venter, the scientist who led the first sequencing of the human genome. HLI operates
  clinics in San Diego and South San Francisco that deliver an executive health assessment combining whole-body
  and brain MRI, coronary CT angiography with FDA-cleared Cleerly AI plaque analysis, clinical-grade whole
  genome sequencing of all 6.4 billion base pairs in a CLIA-certified lab, and 120+ blood biomarkers,
  all interpreted by the company's proprietary Longevity AI models against a reference set of more than
  50,000 sequenced genomes. Results are delivered to clients through the HLI mobile app and an Auth0-protected
  client portal. HLI publishes no public developer program, API reference, or machine-readable API contract;
  its software is shipped only as an end-user product to clinic clients.
